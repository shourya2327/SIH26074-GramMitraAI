server.port=8080
spring.application.name=grammitraai-backend

# Datasource configuration (MySQL default, with fallback to H2 in-memory if MySQL offline)
spring.datasource.url=jdbc:mysql://localhost:3306/grammitraai_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
grammitra.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
grammitra.app.jwtExpirationMs=86400000

# External AI Service URL
grammitra.ai.service.url=http://localhost:8000

# Logging
logging.level.com.grammitraai=INFO
